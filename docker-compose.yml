services:
  frontend:
    build:
      context: ./frontend
      args:
        # Remote API: that host must send Access-Control-Allow-Origin for your real frontend origin, or use same-origin `/api` behind your gateway.
        - VITE_API_BASE_URL=https://photobook.kilometers.ai/api
    container_name: my-frontend
    networks:
      - app-network
    ports:
      - "3000:80" # This port will only be used by nginx on the host

  backend:
    build:
      context: ./backend
      args:
        - DATABASE_URL=${DATABASE_URL}
        - NODE_ENV=${NODE_ENV}
    container_name: my-backend
    ports:
      - "6000:5004"
    environment:
      - NODE_ENV=${NODE_ENV}
      - DATABASE_URL=${DATABASE_URL}
    restart: unless-stopped
    networks:
      - app-network
    depends_on:
      - db

  db:
    image: postgres:15
    container_name: postgres-db
    ports:
      - "5432:5432"
    environment:
      - POSTGRES_USER=postgres
      - POSTGRES_PASSWORD=postgres
      - POSTGRES_DB=my-database
    volumes:
      - postgres-data:/var/lib/postgresql/data
    networks:
      - app-network
    restart: unless-stopped

networks:
  app-network:
    driver: bridge

volumes:
  postgres-data:
